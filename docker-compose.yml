services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nova_editorial
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  api1:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      INSTANCE_NAME: api1
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  api2:
    build: ./api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      INSTANCE_NAME: api2
    depends_on:
      db: { condition: service_healthy }
    networks: [backend]

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on: [api1, api2]
    networks: [backend]

volumes:
  mysql_data:

networks:
  backend:
    driver: bridge
